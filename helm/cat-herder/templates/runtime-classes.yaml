{{- /* Isolation tiers (PLAN.md §13): RuntimeClass-backed gVisor / Kata microVMs. */ -}}
{{- /* Each is installed only when enabled, so a cluster without the runtime still */ -}}
{{- /* deploys. The runtime adapter sets `runtimeClassName` on the Sandbox pod to */ -}}
{{- /* `gvisor`/`kata` (matching these names) for the corresponding `runtimeTier`. */ -}}
{{- range $name, $cfg := .Values.agentSandbox.runtimeClasses }}
{{- if $cfg.enabled }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: cat-herder
handler: {{ $cfg.handler }}
---
{{- end }}
{{- end }}
