{{- if .Values.dependencies.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: cat-herder-postgres
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-postgres
    app.kubernetes.io/part-of: cat-herder
type: Opaque
stringData:
  # Used by the postgres StatefulSet (POSTGRES_PASSWORD) and, via database-url,
  # by the control plane.
  password: {{ .Values.dependencies.postgres.password | quote }}
  database-url: "postgres://{{ .Values.dependencies.postgres.user }}:{{ .Values.dependencies.postgres.password }}@{{ .Values.dependencies.postgres.serviceName }}:5432/{{ .Values.dependencies.postgres.database }}"
{{- end }}
