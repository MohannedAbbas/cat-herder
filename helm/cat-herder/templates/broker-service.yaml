{{- if .Values.broker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cat-herder-broker
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-broker
    app.kubernetes.io/part-of: cat-herder
spec:
  selector:
    app.kubernetes.io/name: cat-herder-broker
  ports:
    - name: grpc
      port: {{ .Values.broker.grpcPort }}
      targetPort: {{ .Values.broker.grpcPort }}
{{- end }}
