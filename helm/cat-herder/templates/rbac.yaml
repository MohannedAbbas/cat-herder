apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cat-herder-api
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-api
    app.kubernetes.io/part-of: cat-herder
rules:
  # The control plane creates/manages agent sandboxes (execution substrate).
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxclaims"]
    verbs: ["get", "list", "watch"]
  # The control plane reads provider API-key Secrets (to inject into sandboxes).
  # Scoped to this namespace by the Role.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # The control plane owns the encryption-key Secret: it generates the key on first
  # boot and rewrites it on rotation (via server-side apply). SSA on a missing Secret
  # is a `create`, so `create` is granted here too — still scoped to just that Secret
  # by `resourceNames`, so it is no broader than `patch`.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.encryptionKeySecret }}"]
    verbs: ["get", "patch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cat-herder-api
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-api
    app.kubernetes.io/part-of: cat-herder
subjects:
  - kind: ServiceAccount
    name: cat-herder-api
    namespace: {{ .Values.namespace | default "cat-herder" }}
roleRef:
  kind: Role
  name: cat-herder-api
  apiGroup: rbac.authorization.k8s.io
