{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cat-herder
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder
    app.kubernetes.io/part-of: cat-herder
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API (same-origin for the UI's fetch calls).
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: cat-herder-api
                port:
                  number: 80
          # UI (static SPA).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cat-herder-ui
                port:
                  number: 80
{{- end }}
