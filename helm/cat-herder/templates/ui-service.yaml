apiVersion: v1
kind: Service
metadata:
  name: cat-herder-ui
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-ui
    app.kubernetes.io/part-of: cat-herder
spec:
  selector:
    app.kubernetes.io/name: cat-herder-ui
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.ui.port }}
