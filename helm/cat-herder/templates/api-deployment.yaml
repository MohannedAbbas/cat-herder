apiVersion: apps/v1
kind: Deployment
metadata:
  name: cat-herder-api
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-api
    app.kubernetes.io/part-of: cat-herder
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cat-herder-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cat-herder-api
    spec:
      serviceAccountName: cat-herder-api
      containers:
        - name: api
          image: "{{ .Values.controlPlane.image }}"
          env:
            - name: CAT_HERDER_NAMESPACE
              value: {{ .Values.namespace | default "cat-herder" }}
            - name: PORT
              value: {{ .Values.controlPlane.port | quote }}
            - name: CAT_HERDER_HARNESS_IMAGE
              value: "{{ .Values.harness.image }}"
            - name: CAT_HERDER_STUCK_TIMEOUT_SECS
              value: {{ .Values.controlPlane.stuckTimeoutSecs | default 900 | quote }}
            - name: CAT_HERDER_RUN_TIMEOUT_SECS
              value: {{ .Values.controlPlane.runTimeoutSecs | default 3600 | quote }}
            - name: CAT_HERDER_SHARD_COUNT
              value: {{ .Values.controlPlane.shardCount | default 16 | quote }}
            - name: CAT_HERDER_LEASE_TTL_SECS
              value: {{ .Values.controlPlane.leaseTtlSecs | default 30 | quote }}
            - name: CAT_HERDER_RECONCILE_INTERVAL_SECS
              value: {{ .Values.controlPlane.reconcileIntervalSecs | default 10 | quote }}
            # Stable per-replica owner id for the shard-lease reconciler (PLAN.md §6).
            - name: CAT_HERDER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CAT_HERDER_AGENT_MODELS
              value: {{ .Values.agents.models | toJson | quote }}
            - name: CAT_HERDER_ENCRYPTION_SECRET
              value: {{ .Values.encryptionKeySecret | quote }}
            - name: CAT_HERDER_ENCRYPTION_SECRET_KEY
              value: {{ .Values.encryptionKeySecretKey | quote }}
            - name: CAT_HERDER_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: cat-herder-admin
                  key: username
            - name: CAT_HERDER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cat-herder-admin
                  key: password
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmApiKeySecret }}
                  key: api-key
                  optional: true
            - name: CAT_HERDER_GRPC_PORT
              value: {{ .Values.controlPlane.grpcPort | quote }}
            {{- if .Values.dependencies.postgres.enabled }}
            - name: CAT_HERDER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cat-herder-postgres
                  key: database-url
                  optional: true
            {{- end }}
            {{- if .Values.dependencies.nats.enabled }}
            - name: CAT_HERDER_NATS_URL
              value: "nats://{{ .Values.dependencies.nats.serviceName }}:4222"
            {{- end }}
            {{- if .Values.oauth.github.enabled }}
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.github.secret }}
                  key: client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.github.secret }}
                  key: client-secret
            - name: GITHUB_OAUTH_REDIRECT_URL
              value: {{ .Values.oauth.github.redirectUrl | quote }}
            - name: GITHUB_OAUTH_ALLOWED_USERS
              value: {{ join "," .Values.oauth.github.allowedUsers | quote }}
            {{- end }}
            {{- if and .Values.oauth.gitlab .Values.oauth.gitlab.enabled }}
            - name: GITLAB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.gitlab.secret }}
                  key: client-id
            - name: GITLAB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.gitlab.secret }}
                  key: client-secret
            - name: GITLAB_OAUTH_REDIRECT_URL
              value: {{ .Values.oauth.gitlab.redirectUrl | quote }}
            - name: GITLAB_OAUTH_ALLOWED_USERS
              value: {{ join "," .Values.oauth.gitlab.allowedUsers | quote }}
            {{- end }}
            {{- if .Values.broker.enabled }}
            # JIT credential broker (PLAN.md §11.3): the control plane is a gRPC client
            # to the separate broker service. The GitHub App private key lives only in
            # the broker; the control plane holds no git-host credentials.
            - name: CAT_HERDER_BROKER_URL
              value: "http://cat-herder-broker:{{ .Values.broker.grpcPort }}"
            {{- end }}
            {{- if and .Values.broker.enabled .Values.broker.tlsSecret }}
            - name: CAT_HERDER_BROKER_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.tlsSecret }}
                  key: ca.crt
                  optional: true
            - name: CAT_HERDER_BROKER_CLIENT_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.tlsSecret }}
                  key: client.crt
                  optional: true
            - name: CAT_HERDER_BROKER_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.tlsSecret }}
                  key: client.key
                  optional: true
            {{- end }}
            {{- if .Values.oauth.mock.enabled }}
            # DEV-ONLY mock OAuth: bypasses real SSO and mints an admin session
            # directly. MUST be off in production.
            - name: CAT_HERDER_OAUTH_MOCK
              value: "true"
            - name: CAT_HERDER_OAUTH_MOCK_USERNAME
              value: {{ .Values.oauth.mock.username | default "dev-user" | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.controlPlane.port }}
            - name: grpc
              containerPort: {{ .Values.controlPlane.grpcPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.controlPlane.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.controlPlane.port }}
