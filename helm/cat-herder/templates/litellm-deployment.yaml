{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cat-herder-litellm
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-litellm
    app.kubernetes.io/part-of: cat-herder
spec:
  replicas: {{ .Values.litellm.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cat-herder-litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cat-herder-litellm
    spec:
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image }}"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.masterKeySecret }}
                  key: master-key
            - name: LITELLM_CONFIG_PATH
              value: /app/config/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.litellm.port }}
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: {{ .Values.litellm.port }}
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: {{ .Values.litellm.port }}
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: cat-herder-litellm-config
{{- end }}
