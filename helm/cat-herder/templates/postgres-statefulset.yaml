{{- if .Values.dependencies.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cat-herder-postgres
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-postgres
    app.kubernetes.io/part-of: cat-herder
spec:
  serviceName: {{ .Values.dependencies.postgres.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cat-herder-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cat-herder-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.dependencies.postgres.image }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.dependencies.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.dependencies.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cat-herder-postgres
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.dependencies.postgres.user | quote }}]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.dependencies.postgres.user | quote }}]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.dependencies.postgres.storage }}
{{- end }}
