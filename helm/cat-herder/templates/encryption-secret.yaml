{{- /*
Seed an empty encryption-key Secret on first install so the control plane can
server-side-apply (patch) the key into an *existing* Secret. Server-side apply
that creates a new Secret requires the `create` verb, which can't be scoped by
resourceName; patching an existing one only needs the scoped `patch` verb.
*/ -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.encryptionKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.encryptionKeySecret }}
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-api
    app.kubernetes.io/part-of: cat-herder
type: Opaque
{{- end }}
