{{- if .Values.dependencies.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cat-herder-redis
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder-redis
    app.kubernetes.io/part-of: cat-herder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cat-herder-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cat-herder-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.dependencies.redis.image }}"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
{{- end }}
