apiVersion: v1
kind: Secret
metadata:
  name: cat-herder-admin
  namespace: {{ .Values.namespace | default "cat-herder" }}
  labels:
    app.kubernetes.io/name: cat-herder
    app.kubernetes.io/part-of: cat-herder
type: Opaque
stringData:
  username: {{ .Values.admin.username | quote }}
  password: {{ .Values.admin.password | quote }}
