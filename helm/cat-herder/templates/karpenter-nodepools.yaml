{{- /* On-demand node provisioning via Karpenter (PLAN.md §16). Installs on-demand and */ -}}
{{- /* spot NodePools; the Karpenter controller + a cloud NodeClass (e.g. EC2NodeClass) */ -}}
{{- /* must be installed separately. Set `.Values.karpenter.nodeClassRef` to the NodeClass. */ -}}
{{- if .Values.karpenter.enabled }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cat-herder-on-demand
spec:
  template:
    spec:
      nodeClassRef:
        name: {{ .Values.karpenter.nodeClassRef }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  limits:
    cpu: {{ .Values.karpenter.onDemandCpuLimit }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cat-herder-spot
spec:
  template:
    spec:
      nodeClassRef:
        name: {{ .Values.karpenter.nodeClassRef }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
  limits:
    cpu: {{ .Values.karpenter.spotCpuLimit }}
{{- end }}
