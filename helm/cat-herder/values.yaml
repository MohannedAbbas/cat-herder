# Cat Herder values — see PLAN.md §13/§20.

namespace: cat-herder

# Image refs are single strings so Tilt can inject locally-built images
# (see Tiltfile `image_keys`).
controlPlane:
  image: ghcr.io/your-org/cat-herder:0.1.0
  replicas: 1
  port: 8080

harness:
  image: ghcr.io/your-org/cat-herder-agent-harness:0.1.0

ui:
  image: ghcr.io/your-org/cat-herder-ui:0.1.0
  replicas: 1
  port: 80

# In-cluster dependencies (subcharts: Postgres/NATS/Redis/MinIO).
dependencies:
  postgres:
    enabled: true
  nats:
    enabled: true
  redis:
    enabled: true
  minio:
    enabled: true

agentSandbox:
  enabled: true

ingress:
  enabled: false
  className: traefik
  host: cat-herder.example.com
