# Cat Herder values — see PLAN.md §13/§20.

namespace: cat-herder

# LLM configuration for the harness.
# `model` is provider-qualified (e.g. "anthropic:claude-sonnet-4-6"). The API key is
# provided via a Secret named `llmApiKeySecret` (create it with:
#   kubectl -n cat-herder create secret generic cat-herder-llm --from-literal=api-key=...
# ). The control plane passes it through to the sandbox pod env.
model: ""
llmApiKeySecret: cat-herder-llm

# Image refs are single strings so Tilt can inject locally-built images
# (see Tiltfile `image_keys`).
controlPlane:
  image: ghcr.io/your-org/cat-herder:0.1.0
  replicas: 1
  port: 8080

harness:
  image: ghcr.io/your-org/cat-herder-agent-harness:0.1.0

ui:
  image: ghcr.io/your-org/cat-herder-ui:0.1.0
  replicas: 1
  port: 80

# In-cluster dependencies (subcharts: Postgres/NATS/Redis/MinIO).
dependencies:
  postgres:
    enabled: true
  nats:
    enabled: true
  redis:
    enabled: true
  minio:
    enabled: true

agentSandbox:
  enabled: true

ingress:
  enabled: false
  className: traefik
  host: cat-herder.example.com
