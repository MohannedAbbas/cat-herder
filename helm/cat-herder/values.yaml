# Cat Herder values — see PLAN.md §13/§20.

namespace: cat-herder

# LLM configuration for the harness.
# Models are agent-specific — each agent template carries its own `model` (see the
# Agents admin tab / `agents.models` below); there is no global fallback model.
# Each provider uses its OWN Secret (see the Providers admin tab): by convention
# `cat-herder-<provider-id>` with key `api-key`, e.g.
#   kubectl -n cat-herder create secret generic cat-herder-deepseek --from-literal=api-key=sk-...
#   kubectl -n cat-herder create secret generic cat-herder-openai   --from-literal=api-key=sk-...
# `llmApiKeySecret` below is only a fallback when a run's model has no matching
# provider.
llmApiKeySecret: cat-herder-llm

# Encryption-key Secret: the control plane generates a random key into this Secret on
# first boot (no operator initialization) and rewrites it on rotation. Tokens are
# encrypted at rest with this key, but stored separately in Postgres.
encryptionKeySecret: cat-herder-encryption
encryptionKeySecretKey: key

# Per-agent model overrides (agent id -> model). Leave empty to use the built-in
# catalog defaults. Example (DeepSeek):
agents:
  models:
    agent-codeact: "deepseek:deepseek-chat"
    agent-reviewer: "deepseek:deepseek-chat"
    agent-docs: "deepseek:deepseek-reasoner"

# Admin login (local auth). The control plane bcrypt-hashes `password` at startup;
# it lives only in a Secret. Override in production.
admin:
  username: admin
  password: admin-change-me

# Image refs are single strings so Tilt can inject locally-built images
# (see Tiltfile `image_keys`).
controlPlane:
  image: ghcr.io/your-org/cat-herder:0.1.0
  replicas: 1
  port: 8080
  # Stuck-run watchdog (PLAN.md §6). The runtime adapter writes both timeouts onto
  # each run's Sandbox:
  #   - stuckTimeoutSecs -> the harness reports `stuck` (and its pod liveness probe
  #     fails) when the agent makes no progress this long.
  #   - runTimeoutSecs   -> the Sandbox's `shutdownTime` hard deadline; the
  #     agent-sandbox controller garbage-collects a runaway sandbox on its own.
  stuckTimeoutSecs: 900
  runTimeoutSecs: 3600

harness:
  image: ghcr.io/your-org/cat-herder-agent-harness:0.1.0

ui:
  image: ghcr.io/your-org/cat-herder-ui:0.1.0
  replicas: 1
  port: 80

# In-cluster dependencies, bundled as k8s-native workloads in this chart
# (see PLAN.md §13/§19 — no managed services).
dependencies:
  # PostgreSQL: StatefulSet + headless Service + PVC + Secret. The control plane
  # uses it for run persistence when CAT_HERDER_DATABASE_URL is injected (which
  # this chart does automatically when enabled). Disable to fall back to the
  # in-memory repository (single-replica dev only).
  postgres:
    enabled: true
    image: postgres:16-alpine
    user: cat_herder
    database: cat_herder
    # Internal ClusterIP-only; override in production via `--set` or a values file.
    password: cat-herder-dev-password
    storage: 1Gi
    serviceName: cat-herder-postgres
  nats:
    enabled: false
    # NATS JetStream is the event fan-out *transport* (PLAN.md §9). Postgres remains
    # the durable event authority; JetStream storage here is a short-lived buffer.
    image: nats:2.10-alpine
    storage: 1Gi
    serviceName: cat-herder-nats
  redis:
    enabled: false
  minio:
    enabled: false

agentSandbox:
  enabled: true
  # Network egress controls for the sandbox ("harness") pods. These pods run
  # agent-generated code, so by default ALL egress is DENIED and only the hosts
  # below are allowed (see templates/sandbox-networkpolicy.yaml). This bounds the
  # blast radius of a compromised agent: it can no longer exfiltrate secrets to an
  # arbitrary endpoint.
  #
  # The allowed destinations are:
  #   1. DNS ......... UDP+TCP :53 to the cluster DNS service in kube-system.
  #   2. Control plane cat-herder-api on :80 in the release namespace, so the
  #                    harness can report run events back.
  #   3. Git hosts ... github.com, gitlab.com, codeberg.org on :443, for cloning.
  #   4. LLM API ..... the configured provider's API on :443.
  #
  # IMPORTANT — why CIDRs, not hostnames: a standard Kubernetes NetworkPolicy
  # matches peers by pod/namespace selector or by `ipBlock` CIDR; it cannot match
  # on DNS names. The git-host and LLM rules are therefore expressed as resolved
  # IP CIDRs. If you use a different LLM provider or git host, update the CIDRs
  # below (e.g. `dig +short api.openai.com` / `dig +short github.com`) and re-run
  # the release. If your CNI supports FQDN policies (e.g. Cilium), you can replace
  # these ipBlocks with toFQDNs rules. Set `.enabled: false` to turn egress
  # filtering off entirely (NOT recommended).
  networkPolicy:
    enabled: true
    # 1. DNS — the cluster DNS service in kube-system (kube-dns / CoreDNS).
    dns:
      namespace: kube-system
      # Match the CoreDNS pods. Override if your cluster DNS labels differ.
      podSelector:
        k8s-app: kube-dns
      port: 53
    # 2. In-cluster control plane Service (cat-herder-api) in this namespace.
    #    NOTE: this is the POD's containerPort (8080), NOT the Service's :80
    #    port. NetworkPolicy egress rules match the destination pod after the
    #    Service DNAT rewrites 80 -> targetPort 8080, so it must be 8080.
    controlPlane:
      port: 8080
    # 3. Supported git hosts on :443.
    #    To support a different/extra git host, add its IP CIDRs to `cidrs`.
    gitHosts:
      port: 443
      cidrs:
        - 140.82.112.0/20    # github.com
        - 192.30.252.0/22    # github.com (legacy range)
        - 172.65.251.78/32   # gitlab.com
        - 217.197.84.0/24    # codeberg.org
    # 4. The configured LLM provider API on :443.
    #    CHANGE THIS when you use a different provider, e.g.:
    #      DeepSeek  ->  api.deepseek.com
    #      OpenAI    ->  api.openai.com,  160.79.104.0/23
    #      Anthropic ->  api.anthropic.com, 160.79.104.0/23
    #    `dig +short api.deepseek.com` gives the current CIDR(s) to list.
    llm:
      port: 443
      cidrs:
        - 3.173.21.0/24      # api.deepseek.com (resolved at time of writing;
                             # replace with your provider's current ranges)
    # 5. Package registries on :443, so agents can fetch dependencies while
    #    building/testing (e.g. `cargo` needs static.crates.io / index.crates.io).
    #    crates.io is served by Fastly; add more registries (npm, pypi, …) as CIDRs.
    registries:
      port: 443
      cidrs:
        - 151.101.0.0/16     # Fastly CDN: static.crates.io + index.crates.io

# GitHub OAuth SSO (optional; password login still works when disabled).
# When enabled the API exposes /v1/auth/github/login and
# /v1/auth/github/callback. The client id/secret come from the Secret named in
# `secret` (keys `client-id` and `client-secret`); the allow-list is the comma
# separated set of GitHub logins permitted to become admin. `redirectUrl` is the
# public base URL of the control plane (the callback path is appended), and must
# match the OAuth App's registered callback exactly.
#
# Local dev (Tilt exposes the API on :8080 and the UI proxies /v1 to it): set
#   redirectUrl: "http://localhost:8080"
# and register the callback URL http://localhost:8080/v1/auth/github/callback with
# the GitHub OAuth App. The UI detects enabled providers via GET /v1/auth/sso-providers
# and shows a "Sign in with GitHub" button.
oauth:
  github:
    enabled: false
    secret: cat-herder-github-oauth
    redirectUrl: ""
    allowedUsers: []
  # GitLab SSO mirrors GitHub. For local dev set redirectUrl to
  # "http://localhost:8080" and register http://localhost:8080/v1/auth/gitlab/callback.
  gitlab:
    enabled: false
    secret: cat-herder-gitlab-oauth
    redirectUrl: ""
    allowedUsers: []
  # DEV-ONLY mock OAuth. When enabled, the control plane pretends GitHub and GitLab
  # SSO are both configured WITHOUT any real client id/secret: both providers are
  # reported by /v1/auth/sso-providers and their `/login` routes skip the provider
  # redirect, minting an admin session directly as `username`. Handy for exercising
  # the SSO login flow locally (no OAuth app registration needed).
  # MUST be off in production — it bypasses real authentication.
  mock:
    enabled: true
    username: dev-user

ingress:
  enabled: false
  className: traefik
  host: cat-herder.example.com
