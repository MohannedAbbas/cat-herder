# Cat Herder values — see PLAN.md §13/§20.

namespace: cat-herder

# LLM configuration for the harness.
# Models are agent-specific — each agent template carries its own `model` (see the
# Agents admin tab / `agents.models` below); there is no global fallback model.
# Each provider uses its OWN Secret (see the Providers admin tab): by convention
# `cat-herder-<provider-id>` with key `api-key`, e.g.
#   kubectl -n cat-herder create secret generic cat-herder-deepseek --from-literal=api-key=sk-...
#   kubectl -n cat-herder create secret generic cat-herder-openai   --from-literal=api-key=sk-...
# `llmApiKeySecret` below is only a fallback when a run's model has no matching
# provider.
llmApiKeySecret: cat-herder-llm

# Encryption-key Secret: the control plane generates a random key into this Secret on
# first boot (no operator initialization) and rewrites it on rotation. Tokens are
# encrypted at rest with this key, but stored separately in Postgres.
encryptionKeySecret: cat-herder-encryption
encryptionKeySecretKey: key

# Git write token (a fine-grained PAT with Contents: Write + Pull requests: Write)
# used to open a PR from the agent's diff. Held only by the control plane — never
# injected into the sandbox. Create it with:
#   kubectl -n cat-herder create secret generic cat-herder-git-write --from-literal=token=ghp_...
gitWriteTokenSecret: cat-herder-git-write

# Per-agent model overrides (agent id -> model). Leave empty to use the built-in
# catalog defaults. Example (DeepSeek):
agents:
  models:
    agent-codeact: "deepseek:deepseek-chat"
    agent-reviewer: "deepseek:deepseek-chat"
    agent-docs: "deepseek:deepseek-reasoner"

# Admin login (local auth). The control plane bcrypt-hashes `password` at startup;
# it lives only in a Secret. Override in production.
admin:
  username: admin
  password: admin-change-me

# Image refs are single strings so Tilt can inject locally-built images
# (see Tiltfile `image_keys`).
controlPlane:
  image: ghcr.io/your-org/cat-herder:0.1.0
  replicas: 1
  port: 8080

harness:
  image: ghcr.io/your-org/cat-herder-agent-harness:0.1.0

ui:
  image: ghcr.io/your-org/cat-herder-ui:0.1.0
  replicas: 1
  port: 80

# In-cluster dependencies, bundled as k8s-native workloads in this chart
# (see PLAN.md §13/§19 — no managed services).
dependencies:
  # PostgreSQL: StatefulSet + headless Service + PVC + Secret. The control plane
  # uses it for run persistence when CAT_HERDER_DATABASE_URL is injected (which
  # this chart does automatically when enabled). Disable to fall back to the
  # in-memory repository (single-replica dev only).
  postgres:
    enabled: true
    image: postgres:16-alpine
    user: cat_herder
    database: cat_herder
    # Internal ClusterIP-only; override in production via `--set` or a values file.
    password: cat-herder-dev-password
    storage: 1Gi
    serviceName: cat-herder-postgres
  nats:
    enabled: false
  redis:
    enabled: false
  minio:
    enabled: false

agentSandbox:
  enabled: true

# GitHub OAuth SSO (optional; password login still works when disabled).
# When enabled the API exposes /v1/auth/github/login and
# /v1/auth/github/callback. The client id/secret come from the Secret named in
# `secret` (keys `client-id` and `client-secret`); the allow-list is the comma
# separated set of GitHub logins permitted to become admin. `redirectUrl` is the
# public base URL of the control plane (the callback path is appended).
oauth:
  github:
    enabled: false
    secret: cat-herder-github-oauth
    redirectUrl: ""
    allowedUsers: []

ingress:
  enabled: false
  className: traefik
  host: cat-herder.example.com
