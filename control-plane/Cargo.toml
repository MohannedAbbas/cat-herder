[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/api-http",
    "crates/adapters/runtime-agent-sandbox",
    "crates/adapters/store-inmemory",
    "crates/adapters/store-postgres",
    "crates/adapters/store-nats",
    "crates/adapters/credentials-github",
    "crates/adapters/credential-broker",
    "crates/adapters/credential-broker-rpc",
    "crates/bin/cat-herder",
    "crates/bin/cat-herder-broker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/your-org/cat-herder"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.16"
ring = "0.17"
base64 = "0.22"
axum-extra = { version = "0.10", features = ["cookie"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-nats = "0.38"
jsonwebtoken = "9"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3.0"
futures = "0.3"
