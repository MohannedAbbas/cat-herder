[package]
name = "cat-herder-store-inmemory"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cat-herder-domain = { path = "../../domain" }
tokio.workspace = true

[dev-dependencies]
# `test-util` enables tokio's paused-clock helpers (`start_paused`, `advance`) used to
# test the in-memory lease TTL deterministically.
tokio = { workspace = true, features = ["test-util"] }
