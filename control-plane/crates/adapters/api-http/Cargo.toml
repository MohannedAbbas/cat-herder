[package]
name = "cat-herder-api-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cat-herder-domain = { path = "../../domain" }
cat-herder-application = { path = "../../application" }
cat-herder-runtime-agent-sandbox = { path = "../runtime-agent-sandbox" }
cat-herder-credential-broker = { path = "../credential-broker" }
cat-herder-credential-broker-rpc = { path = "../credential-broker-rpc" }
cat-herder-store-inmemory = { path = "../store-inmemory" }
cat-herder-store-postgres = { path = "../store-postgres" }
cat-herder-store-nats = { path = "../store-nats" }
cat-herder-store-redis = { path = "../store-redis" }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
axum.workspace = true
axum-extra.workspace = true
bcrypt.workspace = true
reqwest.workspace = true
ring.workspace = true
base64.workspace = true
tonic.workspace = true
prost.workspace = true
futures.workspace = true
kube = { version = "4.2", features = ["client"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
tonic-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
wiremock = "0.6"
