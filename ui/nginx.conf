server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the control plane (same-origin for the UI's fetch calls).
    # The UI Service and API Service share the namespace, so the short name resolves.
    location /v1/ {
        proxy_pass http://cat-herder-api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown routes serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable cache for hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
