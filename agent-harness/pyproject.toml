[project]
name = "cat-herder-harness"
version = "0.1.0"
description = "Deep Agents (LangGraph) harness for Cat Herder — runs inside the sandbox pod"
requires-python = ">=3.12"
dependencies = [
    # Version-pin before first release (see PLAN.md §19/§21).
    "deepagents",
    "langgraph",
    "langchain",
    "grpcio",
    "protobuf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_herder_harness"]

[tool.uv]
package = true
