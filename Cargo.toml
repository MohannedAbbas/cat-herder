[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/api-http",
    "crates/adapters/runtime-agent-sandbox",
    "crates/adapters/store-inmemory",
    "crates/adapters/store-postgres",
    "crates/bin/cat-herder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/your-org/cat-herder"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "macros"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.16"
axum-extra = { version = "0.10", features = ["cookie"] }
