syntax = "proto3";

package cat_herder.v1;

// JIT credential broker (PLAN.md §11.3). The broker is its own hardened service —
// it holds the git-host App private keys, mints scoped short-lived credentials, and
// records every mint/revoke as a durable grant + audited event. The materialized
// secret is returned only to the authenticated caller (the control plane or a harness
// sidecar) for out-of-band injection, never to the model.
//
// Caller auth is mTLS (tonic + rustls): the client presents a CA-signed cert whose
// URI SAN carries a SPIFFE-style workload id (e.g. spiffe://cat-herder/ns/cat-herder/
// sa/cat-herder-api); the broker verifies the chain against its client CA and checks
// the SAN against an allowlist. When no TLS is configured the service serves plain
// (single-node/dev only, mirroring the harness <-> control-plane channel).

service CredentialBroker {
  // Mint a scoped, short-lived credential for a run's target. Returns the opaque grant
  // (handle `cred://<id>`) and the materialized secret for out-of-band delivery.
  rpc Mint(MintRequest) returns (MintResponse);
  // Revoke a previously minted grant (best-effort server-side + flips the grant).
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // Revoke every active grant for a run (terminal teardown). Idempotent.
  rpc RevokeRun(RevokeRunRequest) returns (RevokeRunResponse);
}

message MintRequest {
  uint64 run_id = 1;
  // The target the credential is scoped to (e.g. "github.com/org/repo").
  string target = 2;
  // The requested action ("clone", "push", "pr", ...).
  string action = 3;
  // The requested scope ("read", "write").
  string scope = 4;
}

message MintResponse {
  Grant grant = 1;
  // The materialized secret (out-of-band delivery only — never to the model).
  string secret = 2;
}

message RevokeRequest {
  uint64 run_id = 1;
  string grant_id = 2;
}

message RevokeResponse {}

message RevokeRunRequest {
  uint64 run_id = 1;
}

message RevokeRunResponse {}

// Grant metadata (the durable record of a mint). Never carries the secret.
message Grant {
  string id = 1;
  uint64 run_id = 2;
  string target = 3;
  string action = 4;
  string scope = 5;
  // "active" | "revoked" | "expired"
  string status = 6;
  // Unix epoch seconds.
  uint64 expires_at = 7;
  uint64 created_at = 8;
  // 0 = never revoked.
  uint64 revoked_at = 9;
  // The issuer's server-side token id (for revocation); empty when the issuer has
  // none. Never the secret.
  string token_id = 10;
}
