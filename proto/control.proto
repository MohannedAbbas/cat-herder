syntax = "proto3";

package cat_herder.v1;

// Harness <-> control plane control channel (PLAN.md §6/§9/§14).
//
// The harness (inside the sandbox pod) is the gRPC CLIENT: the untrusted pod reaches
// OUT to the trusted control plane (which hosts this service), matching the egress
// default-deny policy. One bidirectional stream per run.

service HarnessControl {
  // Bidirectional: the harness streams events + heartbeats; the control plane streams
  // signals (pause/resume/cancel — reserved for human-in-the-loop, not yet sent).
  rpc Connect(stream HarnessMessage) returns (stream ControlMessage);
}

// Harness -> control plane.
message HarnessMessage {
  oneof msg {
    Register register = 1;
    Event event = 2;
    Heartbeat heartbeat = 3;
    Checkpoint checkpoint = 4;
  }
}

// The first message on the stream: identifies the run this channel belongs to.
message Register {
  uint64 run_id = 1;
}

// A harness-reported event (mirrors the HTTP `POST /v1/runs/{id}/events` body).
message Event {
  // "started" | "finished" | "stuck"
  string event_type = 1;
  // "succeeded" | "failed" (for "finished"); empty otherwise.
  string status = 2;
  // The agent's final markdown report (for "finished"); empty otherwise.
  string report = 3;
  // Changed files reported by the harness (for "finished").
  repeated FileChange changes = 4;
  // LLM token usage reported by the harness (for "finished").
  Usage usage = 5;
}

message FileChange {
  string path = 1;
  // "added" | "modified" | "deleted"
  string status = 2;
  // Base64-encoded file content (for added/modified); empty otherwise.
  string content_base64 = 3;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
}

// Periodic liveness signal from the harness (PLAN.md §6). The control-plane stuck-run
// watchdog consumes this; a run with no heartbeat/event within its timeout is Stuck.
message Heartbeat {}

// A LangGraph checkpoint flushed by the harness (PLAN.md §6, NEXT_STEPS #3). The
// control plane stores it opaquely; `serde_type` + `payload` are the output of
// LangGraph's JsonPlusSerializer.dumps_typed on the full CheckpointTuple.
message Checkpoint {
  string thread_id = 1;
  string checkpoint_ns = 2;
  string checkpoint_id = 3;
  // "json" | "msgpack" (the JsonPlusSerializer.dumps_typed tag).
  string serde_type = 4;
  // Serialized CheckpointTuple (opaque to the control plane).
  bytes payload = 5;
}

// Control plane -> harness.
message ControlMessage {
  oneof msg {
    Signal signal = 1;
    // Sent once after Register: the latest checkpoint for the run (resume seed), or an
    // empty Checkpoint (empty checkpoint_id) meaning a fresh run.
    Checkpoint checkpoint = 2;
  }
}

// "pause" | "resume" | "cancel" (human-in-the-loop, PLAN.md §10).
message Signal {
  string signal = 1;
}
